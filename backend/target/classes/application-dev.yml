spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/migrant_community_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    com.migrantcommunity: DEBUG
    org.hibernate.SQL: DEBUG
