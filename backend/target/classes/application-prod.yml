spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: ${JWT_SECRET}

admin:
  bootstrap:
    email: ${ADMIN_BOOTSTRAP_EMAIL}
    password: ${ADMIN_BOOTSTRAP_PASSWORD}

logging:
  level:
    com.migrantcommunity: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
