# DATABASE
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# EMAIL
app.email.enabled=${APP_EMAIL_ENABLED:true}

# LOGGING
logging.level.com.migrantcommunity=WARN

# spring-dotenv: explicitly disabled in production.
# Secrets must be injected via real environment variables, not a .env file.
springdotenv.enabled=false
