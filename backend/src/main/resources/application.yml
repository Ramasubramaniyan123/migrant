spring:
  application:
    name: migrant-community-platform
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/migrant_community}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  # Leave unset outside production: services generate an ephemeral random key.
  # Production must provide JWT_SECRET (see application-prod.yml).
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

admin:
  bootstrap:
    email: ${ADMIN_BOOTSTRAP_EMAIL:superadmin@migrantcommunity.com}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.migrantcommunity

logging:
  level:
    com.migrantcommunity: INFO
    org.springframework.security: INFO