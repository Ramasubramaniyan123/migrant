spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.com.migrantcommunity=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN

# spring-dotenv: load backend/.env relative to the Maven working directory.
# SPRINGDOTENV_DIRECTORY is a system-property or env-var alternative when running from outside backend/.
# ignoreIfMissing=false ensures a missing .env is a startup error, not a silent gap.
springdotenv.ignore-if-missing=false
