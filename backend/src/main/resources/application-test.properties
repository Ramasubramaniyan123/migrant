spring.datasource.url=${DB_URL:jdbc:tc:postgresql:15:///migrant_community_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

app.email.enabled=false

logging.level.com.migrantcommunity=WARN

# JWT - TEST ENVIRONMENT ONLY (never use production secret; never load .env in tests)
# Tests that need Spring context override this value via @SpringBootTest(properties = {"jwt.secret=..."})
jwt.secret=test-jwt-signing-secret-that-is-long-enough-123456
jwt.expiration=900000
jwt.refresh-expiration=604800000

# spring-dotenv: disabled in tests; secrets are injected via @SpringBootTest(properties) or this file.
springdotenv.enabled=false
