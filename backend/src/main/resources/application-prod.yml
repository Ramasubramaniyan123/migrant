spring:
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    validate-on-migrate: true

jwt:
  # No default: the application refuses to start in prod without a real secret.
  secret: ${JWT_SECRET}
logging:
  level:
    com.migrantcommunity: WARN
