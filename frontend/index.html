<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23C2410C'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Georgia'>M</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Migrant Community Platform — connect with people from your hometown, language and interests." />
    <title>Migrant Community Platform</title>
    <script>
      // Prevent theme flash: apply stored/system theme before first paint.
      (function () {
        try {
          var stored = localStorage.getItem('mcp-theme');
          var dark = stored === 'dark' ||
            ((!stored || stored === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
