name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Compile
        run: mvn -q -B compile
      - name: Unit tests
        run: mvn -q -B test -Dtest='com.migrantcommunity.unit.**'
      - name: Package
        run: mvn -q -B package -DskipTests
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
      - name: Build image
        run: docker build -t migrant-community-backend:ci .
